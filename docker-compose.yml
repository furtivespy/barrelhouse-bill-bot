# Copy data/config.json.example → data/config.json and replace every REPLACE_ME_*
# before `docker compose up`. The bind mount is ./data → /data.
services:
  barrelhouse-bill-bot:
    image: gitea.willsullivan.dev/furtivespy/barrelhouse-bill-bot:latest
    build: .
    container_name: barrelhouse-bill-bot
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      BOT_CONFIG: /data/config.json
