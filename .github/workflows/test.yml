name: Tests

# Runs on every pull request and on main. Branch pushes are covered by the
# pull_request run, so they no longer run the suite twice.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # Required check. Fast static lint via Biome.
  lint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: bun run lint

  # Required check. `bun run verify` = lint + this job's two test runs.
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests (UTC)
        run: TZ=UTC bun test

      - name: Run tests (America/New_York)
        run: TZ=America/New_York bun test

  docker-build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: barrelhouse-bill-bot:ci
